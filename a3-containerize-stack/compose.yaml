services:
    api:
        build: .
        ports:  
            - "3009:3008"
        environment:
            DATABASE_URL: postgres://postgres:mypassword123@db:5432/tasks
        depends_on:
            - db
    db:
        image: postgres
        environment:
            POSTGRES_PASSWORD: mypassword123
            POSTGRES_DB: tasks
        volumes:
            - taskdata:/var/lib/postgresql

volumes:
  taskdata: